// Default configuration of the dedicated server (D-029). Values and labels: docs/06 §8.
// One `set <cvar> <value>` per line; lines starting with `//` or `#` are comments (a comment
// can't follow a value on the same line). Command-line flags override
// these (`--port`, `--map`, `--set <cvar>=<value>`). Replicated cvars (pm_*) may be set here too:
// they are the match's starting values, sent to every client.

// Listener port (design) and bind address.
set sv_port 28700
set sv_host 0.0.0.0

// The match's map (content/maps/<name>.cmap).
set sv_map arena_greybox

// Players the match admits (design, 1–64; clamped to 37 until the byte-budget scheduler).
set sv_maxClients 32

// Seconds between the metrics log lines (design; 0 = none).
set sv_metricsInterval 10

// Send-buffer backpressure per client, in bytes (ESTIMATEs): drop unreliable past the first,
// close the socket as too slow past the second.
set sv_sendBufferDrop 32768
set sv_sendBufferClose 1048576

// Session security (D-041), in ticks at 60 Hz: 5 s silent (design), 2 s to say HELLO and 10 s to
// READY (ESTIMATEs); a silent player stands still after 30 starved ticks (ESTIMATE).
set sv_timeout 300
set sv_helloTimeout 120
set sv_handshakeTimeout 600
set sv_starveNeutralTicks 30

// Strike score that warns once and that kicks; the rate limits' bursts (ESTIMATEs; refills 2 and
// 0.25 a tick). sv_inputBurst covers the 64-packet anchor fill plus a 2 s TCP stall
// (its floor, 64, is the fill alone: near it honest clients on jittery links can be struck).
set sv_strikeWarn 15
set sv_strikeKick 30
set sv_inputBurst 240
set sv_reliableBurst 20

// Connections one address may hold, upgrades in flight included (ESTIMATE; loopback exempt).
set sv_maxPerIp 8
// Browser origins allowed to connect, comma-separated (default: any), e.g.
// set sv_allowedOrigins https://play.example.org

// sv_strictBuild is left out on purpose: 1 in the bundle, 0 from source (D-031), and a line here
// would apply to both. Set it here only to force one value.

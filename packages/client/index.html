<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>In Shambles</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b1d21;
        color: #e8e8e8;
        font: 13px/1.4 system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #view {
        display: block;
        width: 100%;
        height: 100%;
      }
      #label {
        position: absolute;
        left: 8px;
        bottom: 6px;
        opacity: 0.7;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
      }
      #error {
        position: absolute;
        left: 50%;
        top: 40%;
        transform: translate(-50%, -50%);
        max-width: min(90vw, 40rem);
        padding: 12px 16px;
        background: #3a1d1d;
        border: 1px solid #a33;
        white-space: pre-wrap;
      }
      #error[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <canvas id="view"></canvas>
      <div id="label">client loading…</div>
      <div id="error" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>In Shambles</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b1d21;
        color: #e8e8e8;
        font: 13px/1.4 system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #view {
        display: block;
        width: 100%;
        height: 100%;
      }
      #label {
        position: absolute;
        left: 8px;
        bottom: 6px;
        opacity: 0.7;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
      }
      #error {
        position: absolute;
        left: 50%;
        top: 40%;
        transform: translate(-50%, -50%);
        max-width: min(90vw, 40rem);
        padding: 12px 16px;
        background: #3a1d1d;
        border: 1px solid #a33;
        white-space: pre-wrap;
      }
      #error[hidden] {
        display: none;
      }
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        text-shadow: 0 1px 2px #000;
      }
      /* An id plus [hidden] outranks each panel's own id rule. */
      #hud [hidden],
      #console[hidden] {
        display: none;
      }
      #hud-water {
        position: absolute;
        inset: 0;
        background: rgba(24, 70, 120, 0.38);
      }
      #hud-crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        background: #fff;
        box-shadow: 0 0 0 1px #000;
      }
      #hud-speed {
        position: absolute;
        left: 50%;
        bottom: 18%;
        transform: translateX(-50%);
        font-size: 15px;
        white-space: pre;
      }
      #hud-net {
        position: absolute;
        right: 8px;
        bottom: 8px;
        padding: 4px 6px;
        background: rgba(0, 0, 0, 0.45);
        white-space: pre;
      }
      #hud-prompt {
        position: absolute;
        left: 50%;
        top: 58%;
        transform: translateX(-50%);
        padding: 6px 12px;
        background: rgba(0, 0, 0, 0.55);
        font: 14px system-ui, sans-serif;
      }
      #console {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 45%;
        display: flex;
        flex-direction: column;
        background: rgba(12, 14, 18, 0.88);
        border-bottom: 1px solid #556;
        font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #console-output {
        flex: 1;
        overflow-y: auto;
        padding: 6px 8px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #console-input {
        margin: 0;
        padding: 5px 8px;
        border: 0;
        border-top: 1px solid #334;
        outline: none;
        background: #0b0c10;
        color: #e8e8e8;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <canvas id="view"></canvas>
      <div id="label">client loading…</div>
      <div id="error" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels its superseded run. Pushes to main get one group per run, so no
  # main commit's run is cancelled or dropped from the queue, and each keeps its result.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Uses the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # D-032: the long tier (deterministic long legs, native-ESM allocation guards) blocks too.
      - run: pnpm test:long
      - run: pnpm build

  # D-022: the shared determinism, trace and pmove vectors replayed in all three browser engines.
  # WebKit runs JavaScriptCore, Safari's engine.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
        env:
          BROWSERS: chromium,firefox,webkit

  # D-045: the load tier (real processes on real time: NET-09, 16 bots + 1 headless human, and the
  # reported 63-bot and 4 × 16 legs). It reports and never blocks: a shared runner's noise, not
  # its core count, decides a 4 ms p99, so its first numbers decide later whether it may gate.
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The production builds the legs play: a strict leg refuses one older than its sources.
      - run: pnpm build
      - run: pnpm test:load
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-reports
          path: reports/
          if-no-files-found: warn

  # D-051: the fast tier and the build on Windows, where the game is developed and played as well.
  # The long, browser and load tiers stay on Linux (their real-process and real-time legs are
  # POSIX-shaped or timing-bound); this job blocks like `check`.
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
